name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go vet ./...
      - run: go test ./...
        env:
          # Windows runners are administrators, so the real ETW capture tests
          # must run there: fail instead of skipping if they cannot.
          TRAFFICAM_REQUIRE_ETW: '1'
      - name: ETW capture report (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 -v ./internal/collector/etw/
        env:
          TRAFFICAM_REQUIRE_ETW: '1'
      - name: Build trafficam.exe
        if: runner.os == 'Windows'
        run: go build -o trafficam.exe ./cmd/trafficam
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: trafficam-windows-amd64
          path: trafficam.exe

  # Linux eBPF collector: rebuild the eBPF bytecode from C, then load it into
  # the runner's real kernel and check the flows (needs sudo, which GitHub's
  # runners allow). Runs on x86-64 and arm64.
  linux-ebpf:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: uname -a
      - name: Install clang and libbpf headers
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: Regenerate eBPF objects from bpf/trafficam.bpf.c
        run: go generate ./internal/collector/linuxebpf
      - run: go vet ./internal/collector/linuxebpf ./cmd/ebpfcheck
      - name: Unit tests
        run: go test ./internal/collector/linuxebpf
      - name: Live tests (load eBPF into this runner's kernel)
        run: |
          go test -c -o ebpf.test ./internal/collector/linuxebpf
          sudo TRAFFICAM_EBPF_TEST=1 ./ebpf.test -test.run Live -test.v
      - name: Smoke test ebpfcheck against real traffic
        run: |
          go build -o ebpfcheck ./cmd/ebpfcheck
          sudo ./ebpfcheck -for 15s > flows.jsonl &
          sleep 3
          curl -s -o /dev/null https://github.com || true
          getent hosts example.com || true
          wait
          echo "--- flows seen ---"
          cat flows.jsonl
          grep -q '"name":"curl"' flows.jsonl

  # Key sealing: run the TPM 2.0 code against swtpm (a software TPM), so the
  # TPM path is tested on every change even though runners have no real chip.
  keyseal-tpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Install swtpm
        timeout-minutes: 4
        run: sudo apt-get update && sudo apt-get install -y swtpm
      - name: Key sealing tests (TPM tests must not skip)
        timeout-minutes: 3
        run: go test -count=1 -v ./internal/keyseal
        env:
          TRAFFICAM_REQUIRE_SWTPM: '1'
